<svg width="600" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Search Bar -->
  <rect x="20" y="20" width="560" height="50" rx="10" ry="10" fill="#f0f0f0" stroke="#cccccc" />
  <text x="40" y="50" font-family="Arial" font-size="20" fill="#888888">Buscar...</text>

  <!-- New Service Button -->
  <rect x="20" y="90" width="560" height="50" rx="10" ry="10" fill="#4CAF50" />
  <text x="40" y="120" font-family="Arial" font-size="20" fill="#ffffff">Nuevo Servicio</text>

  <!-- Service Card 1 -->
  <rect x="20" y="160" width="560" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cccccc" />
  <text x="40" y="200" font-family="Arial" font-size="18" fill="#333333">Servicio 1</text>
  <text x="40" y="230" font-family="Arial" font-size="14" fill="#666666">Descripción del servicio 1</text>

  <!-- Service Card 2 -->
  <rect x="20" y="280" width="560" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cccccc" />
  <text x="40" y="320" font-family="Arial" font-size="18" fill="#333333">Servicio 2</text>
  <text x="40" y="350" font-family="Arial" font-size="14" fill="#666666">Descripción del servicio 2</text>

  <!-- Pagination Controls -->
  <rect x="250" y="400" width="100" height="40" rx="10" ry="10" fill="#4CAF50" />
  <text x="280" y="430" font-family="Arial" font-size="20" fill="#ffffff">1</text>
</svg>
